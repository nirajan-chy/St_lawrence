<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>audio control</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio controls>
      <source src="audio.mpeg" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <video controls height="200vh" width="auto">
      <source
        src="Tere Mast Mast Do Nain (Lyrics) - Rahat Fateh Ali Khan  Shreya Ghoshal - Cassettes Records (1080p, h264).mp4"
        type="video/mp4"
      />
      Your browser doesnot
      https://www.youtube.com/watch?v=i6QD3zBRpyA&list=RDi6QD3zBRpyA&start_radio=1support
      the video tag.
    </video>
    <iframe
      src="https://www.youtube.com/watch?v=i6QD3zBRpyA&list=RDi6QD3zBRpyA&start_radio=1"
      width="200vh"
      height="auto"
      frameborder="0"
    ></iframe>
  </body>
</html>
