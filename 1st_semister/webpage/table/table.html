<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      .table {
        display: flex;
        margin-top: 8rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      table {
        border: 1px solid black;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="table">
      <h2>Table</h2>

      <table>
        <tr>
          <th>S.N</th>
          <th>Name</th>
          <th>Section</th>
          <th>Faculty</th>
        </tr>

        <tr>
          <td>1</td>
          <td>Nirajan</td>
          <td>A</td>
          <td>Science</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Samir</td>
          <td>A</td>
          <td>Science</td>
        </tr>
      </table>
    </div>
  </body>
</html>
